name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --check

      - name: Check
        run: cargo check --all-targets

      - name: Tests
        run: cargo test --all-targets

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Smoke test (app real, sem GPU usa WARP)
        shell: pwsh
        run: |
          cargo build
          pwsh -NoProfile -File tools/smoke.ps1 -Exe target/debug/maripdf.exe -TimeoutSec 180
