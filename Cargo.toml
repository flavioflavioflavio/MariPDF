[package]
name        = "maripdf"
version     = "1.0.0-rc.1"
edition     = "2021"
authors     = ["Flávio Takemoto"]
description = "Leitor de PDF rápido e focado para Windows"
license     = "GPL-3.0-or-later"
homepage    = "https://github.com/flavioflavioflavio/MariPDF"
repository  = "https://github.com/flavioflavioflavio/MariPDF"
readme      = "README.md"
keywords    = ["pdf", "reader", "windows"]
categories  = ["multimedia"]

# Fase 0+1 — dependências core
[dependencies]
# --- UI & Renderização ---
egui          = "0.31"
eframe        = { version = "0.31", features = ["wgpu"] }
wgpu          = "24"

# --- Engine PDF (pdfium — binários prebuilt do Chromium, renderização premium) ---
# ADR-002: PDFium é a engine oficial da v1.0. Uma troca de engine exige
# benchmark A/B, spike técnico e decisão explícita de licença.
pdfium-render = { version = "0.8", features = ["sync"] }

# --- Async runtime ---
tokio         = { version = "1.45", features = ["rt-multi-thread", "macros"] }

# --- Serialização / Storage ---
serde         = { version = "1.0", features = ["derive"] }
toml          = "0.8"

# --- Diretórios do sistema ---
dirs          = "6"

# --- Erros & Logging ---
thiserror     = "2.0"
tracing       = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender   = "0.2"

# --- i18n (Fluent localization) ---
fluent-bundle = "0.15"
unic-langid   = { version = "0.9", features = ["macros"] }

# --- Imagens (decodifica PNG do ícone embutido) ---
image         = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# --- Diálogo de arquivo nativo (Windows, macOS, Linux) ---
rfd           = "0.15"

# --- Utilitários ---
anyhow        = "1.0"

# --- Abertura de links externos no browser do sistema ---
open          = "5"

# --- Handle nativo da janela (posição/maximização via Win32, BF-412) ---
raw-window-handle = "0.6"

# --- Leitura do registro do Windows (detecção de tema dark/light) ---
winreg        = "0.52"
ureq = { version = "2", features = ["json"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
sha2 = "0.10"
serde_json = "1"
base64 = "0.22"

[build-dependencies]
# Embute ícone .ico e metadados no executável Windows
winres        = "0.1"

[profile.release]
opt-level     = 3
lto           = true          # Link-Time Optimization — binário menor e mais rápido
codegen-units = 1             # Melhor otimização, build mais lento
strip         = true          # Remove símbolos de debug do binário
# Unwind permite que o worker transforme um panic de job em falha recuperável
# (BF-507) em vez de encerrar o processo; o custo em tamanho é pequeno.
panic         = "unwind"

[profile.dev]
opt-level     = 1             # Equilibrio entre velocidade de build e performance em dev

# Binário final
[[bin]]
name = "maripdf"
path = "src/main.rs"
